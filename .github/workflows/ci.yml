name: CI

on:
  push:
    branches: [ main, develop, GUI-beta, feature/tauri-desktop-app ]
  pull_request:
    branches: [ main ]

jobs:
  # The backend is split into three jobs so that lint and type regressions can
  # be required independently of the test suite, which still fails on analyzer
  # rules that were never implemented. They share the same install step; each
  # runs it because jobs do not share a filesystem.
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e ".[web]"

    # ruff comes from requirements-dev.txt, which pins it. Installing it again
    # here would silently pull the latest release and reintroduce the version
    # drift that broke this job on unrelated PRs.
    - name: Lint with ruff
      run: ruff check src/ tests/

  types-backend:
    name: Backend Types
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e ".[web]"

    - name: Type check with mypy
      run: mypy src/ --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        # `web` extra: the API tests and the CLI entrypoint import fastapi and
        # uvicorn, so without it pytest aborts during collection.
        pip install -e ".[web]"

    - name: Run tests with pytest
      run: pytest tests/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: backend
      continue-on-error: true

  lint-and-test-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Lint with ESLint
      working-directory: frontend
      run: npm run lint
    
    - name: Type check with TypeScript
      working-directory: frontend
      run: npx tsc --noEmit
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: cribl-hc:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  web-ui-smoke:
    name: Web UI Smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install backend dependencies
      run: |
        pip install -r requirements.txt
        pip install -e ".[web]"

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    # Screenshot capture moved to the cribl-hc-screenshotter project. What that
    # job proved beyond the images - that both servers actually start and
    # serve - is kept here; the captures themselves are run from the tool.
    - name: Start backend and check it serves
      run: |
        python -m uvicorn cribl_hc.api.app:app --host 127.0.0.1 --port 8080 &
        for _ in $(seq 1 30); do
          curl -sf http://localhost:8080/health >/dev/null && exit 0
          sleep 1
        done
        echo "Backend did not become ready on :8080" >&2
        exit 1

    - name: Start frontend and check it serves
      working-directory: frontend
      run: |
        npm run dev &
        for _ in $(seq 1 60); do
          curl -sf http://localhost:5173 >/dev/null && exit 0
          sleep 1
        done
        echo "Frontend did not become ready on :5173" >&2
        exit 1

    - name: Check the API answers
      run: |
        curl -sf http://localhost:8080/api/v1/health | tee /dev/stderr | grep -q '"status"'
        curl -sf http://localhost:8080/api/v1/analyzers >/dev/null
