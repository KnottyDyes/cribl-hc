name: CI

on:
  push:
    branches: [ main, develop, GUI-beta, feature/tauri-desktop-app ]
  pull_request:
    branches: [ main ]

jobs:
  # The backend is split into three jobs so that lint and type regressions can
  # be required independently of the test suite, which still fails on analyzer
  # rules that were never implemented. They share the same install step; each
  # runs it because jobs do not share a filesystem.
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e ".[web]"

    # ruff comes from requirements-dev.txt, which pins it. Installing it again
    # here would silently pull the latest release and reintroduce the version
    # drift that broke this job on unrelated PRs.
    - name: Lint with ruff
      run: ruff check src/ tests/

  types-backend:
    name: Backend Types
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e ".[web]"

    - name: Type check with mypy
      run: mypy src/ --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        # `web` extra: the API tests and the CLI entrypoint import fastapi and
        # uvicorn, so without it pytest aborts during collection.
        pip install -e ".[web]"

    - name: Run tests with pytest
      run: pytest tests/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: backend
      continue-on-error: true

  lint-and-test-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Lint with ESLint
      working-directory: frontend
      run: npm run lint
    
    - name: Type check with TypeScript
      working-directory: frontend
      run: npx tsc --noEmit
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: cribl-hc:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  screenshots:
    name: Generate UI Screenshots
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies for screenshotter
      working-directory: screenshotter
      run: |
        python -m pip install --upgrade pip
        pip install playwright pillow

    - name: Install Playwright browsers
      run: playwright install chromium --with-deps

    - name: Install backend dependencies
      run: |
        pip install -r requirements.txt
        pip install -e ".[web]"

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Start backend server
      run: |
        python -m uvicorn cribl_hc.api.app:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Start frontend dev server
      working-directory: frontend
      run: |
        npm run dev &
        sleep 10

    - name: Generate screenshots
      working-directory: screenshotter
      run: python generate_screenshots.py

    - name: Upload screenshots
      uses: actions/upload-artifact@v7
      with:
        name: ui-screenshots
        path: screenshotter/screenshots/
        retention-days: 30

