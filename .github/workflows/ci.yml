name: CI

on:
  push:
    branches: [ main, develop, GUI-beta, feature/tauri-desktop-app, fix/docker-build ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test-backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ tests/

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports

    - name: Run tests with pytest
      run: |
        pytest tests/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: backend
      continue-on-error: true

  lint-and-test-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Lint with ESLint
      working-directory: frontend
      run: npm run lint
    
    - name: Type check with TypeScript
      working-directory: frontend
      run: npx tsc --noEmit
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: cribl-hc:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  screenshots:
    name: Generate UI Screenshots
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies for screenshotter
      working-directory: screenshotter
      run: |
        python -m pip install --upgrade pip
        pip install playwright pillow

    - name: Install Playwright browsers
      run: playwright install chromium --with-deps

    - name: Install backend dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Start backend server
      run: |
        python -m uvicorn cribl_hc.api.app:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Start frontend dev server
      working-directory: frontend
      run: |
        npm run dev &
        sleep 10

    - name: Generate screenshots
      working-directory: screenshotter
      run: python generate_screenshots.py

    - name: Upload screenshots
      uses: actions/upload-artifact@v6
      with:
        name: ui-screenshots
        path: screenshotter/screenshots/
        retention-days: 30

