name: Build Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  # Lets the whole matrix be exercised without cutting a tag. Tagging was the
  # only trigger before, so nothing here had ever run.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the builds to a GitHub release'
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux
          # No Intel macOS target. PyInstaller cannot cross-compile, so it
          # needs a genuine x86_64 macOS runner: macos-13 has been retired
          # (jobs sent there queue forever rather than fail), and the
          # replacement macos-15-intel is a larger runner, which is billed
          # even on public repos and needs a Team/Enterprise org plan.
          # Intel Mac users should use the Docker image or the CLI.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Tauri v2 needs webkit2gtk 4.1 and the ayatana appindicator; the 4.0 and
      # libappindicator3 packages named previously belong to Tauri v1 and are
      # not installable on current Ubuntu runners.
      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[web]"
          pip install pyinstaller

      # Build from the spec. A bare `pyinstaller --onefile run_api.py` cannot
      # see the analyzers, which are discovered at runtime with
      # pkgutil.iter_modules; a bundle built that way registers none of them.
      - name: Bundle Python backend
        run: python -m PyInstaller cribl-hc-backend.spec --noconfirm
        shell: bash

      - name: Verify the bundled backend serves and finds its analyzers
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BACKEND="dist/cribl-hc-backend.exe"
          else
            BACKEND="dist/cribl-hc-backend"
          fi
          "$BACKEND" &
          BACKEND_PID=$!
          for _ in $(seq 1 45); do
            curl -sf http://localhost:8080/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/v1/health || { echo "backend did not start" >&2; exit 1; }
          COUNT=$(curl -sf http://localhost:8080/api/v1/analyzers | python -c "import sys,json;print(len(json.load(sys.stdin)['analyzers']))")
          echo "analyzers registered: $COUNT"
          # A frozen build that loses analyzer discovery still starts and still
          # answers /health, so assert on the count rather than on liveness.
          [ "$COUNT" -ge 40 ] || { echo "only $COUNT analyzers in the bundle" >&2; exit 1; }
          # Leave nothing holding 8080 for the rest of the job.
          kill "$BACKEND_PID" 2>/dev/null || true

      # Tauri v2 resolves a sidecar as <name>-<target triple>[.exe]. The copy
      # step used to leave the file unsuffixed, which fails the build outright.
      - name: Stage the backend as a Tauri sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE="${{ matrix.platform.target }}"
          # Rust renamed this print request; host-triple is a hard error on
          # current toolchains and host-tuple is absent on older ones.
          HOST="$(rustc --print host-tuple 2>/dev/null || rustc --print host-triple)"
          if [ "$TRIPLE" != "$HOST" ]; then
            echo "Target $TRIPLE does not match host $HOST; PyInstaller cannot cross-compile." >&2
            exit 1
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist/cribl-hc-backend.exe" "src-tauri/binaries/cribl-hc-backend-${TRIPLE}.exe"
          else
            cp "dist/cribl-hc-backend" "src-tauri/binaries/cribl-hc-backend-${TRIPLE}"
            chmod +x "src-tauri/binaries/cribl-hc-backend-${TRIPLE}"
          fi
          ls -la src-tauri/binaries/

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install root dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build --target ${{ matrix.platform.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # With --target, bundles land under target/<triple>/release/bundle.
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p artifacts
          find "src-tauri/target/${{ matrix.platform.target }}/release/bundle" \
            -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
                       -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cribl-hc-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    # Only publishes for a tag, or when a manual run opts in.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
